version: "2"

linters:
  default: standard
  settings:
    errcheck:
      # Best-effort datagrams and socket teardown have no useful error to act
      # on: a lost UDP write is indistinguishable from a lost packet, which
      # every protocol here already tolerates.
      exclude-functions:
        - (net.PacketConn).WriteTo
        - (net.PacketConn).Close
        - (*net.UDPConn).WriteTo
        - (*net.UDPConn).WriteToUDPAddrPort
        - (*net.conn).Close
        - (*net.conn).SetReadDeadline
        - (*os.File).Close
        - (net.Conn).Close
        - (net.Conn).SetReadDeadline
        - (io.Closer).Close
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck]
